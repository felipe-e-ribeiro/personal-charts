{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform-chart.fullname" . }}
  labels:
    {{- include "platform-chart.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if and .Values.api.enabled .Values.frontend.enabled }}
          {{/* Ambos coexistem no mesmo host: API fica sob apiPath, frontend pega o resto (mesmo domínio, sem CORS). */}}
          - path: {{ .Values.ingress.apiPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-chart.fullname" . }}-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-chart.fullname" . }}-frontend
                port:
                  number: 80
          {{- else if .Values.api.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-chart.fullname" . }}-api
                port:
                  number: 80
          {{- else if .Values.frontend.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-chart.fullname" . }}-frontend
                port:
                  number: 80
          {{- end }}
{{- end }}
